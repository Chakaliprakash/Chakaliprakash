name: Generate 3D contribution profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/git3d-universe.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: git3d-profile
  cancel-in-progress: true

jobs:
  generate:
    name: Generate isometric 3D contribution calendar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate a different 3D contribution design
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Validate generated visual
        run: |
          set -euo pipefail
          test -s profile-3d-contrib/profile-night-green.svg
          grep -q "<svg" profile-3d-contrib/profile-night-green.svg

      - name: Commit updated visual
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-night-green.svg
          if git diff --cached --quiet; then
            echo "No changes to the 3D contribution visual."
            exit 0
          fi
          git commit -m "chore: update isometric 3D contribution profile"
          git push origin HEAD:main
